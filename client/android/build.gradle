// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        
        // --- ÉP HỆ THỐNG DÙNG KOTLIN 2.0.0 ---
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0"
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// --- VŨ KHÍ TỐI THƯỢNG: ÉP TẤT CẢ MODULE & THƯ VIỆN LÊN JAVA 21 TRỄ NHẤT ---
subprojects {
    afterEvaluate { project ->
        // 1. Ép cấu hình Android của tất cả các plugin phụ
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
                if (project.android.hasProperty("kotlinOptions")) {
                    project.android.kotlinOptions {
                        jvmTarget = '21'
                    }
                }
            }
        }
        
        // 2. Ép trực tiếp vào cỗ máy biên dịch Java
        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        
        // 3. Ép trực tiếp vào cỗ máy biên dịch Kotlin
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "21"
            }
        }
    }
}