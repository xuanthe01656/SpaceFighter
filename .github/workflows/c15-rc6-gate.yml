name: SpaceFighter C15-RC6 Android Release Readiness Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-rc6-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install exact client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Install exact server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Run frozen RC6 manual audit gate
        working-directory: client
        run: npm run gate:c15-rc6
      - name: Upload frozen RC6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: spacefighter-c15-rc6-gate-report
          path: client/dist/c15-rc6/
          if-no-files-found: error
          retention-days: 30
