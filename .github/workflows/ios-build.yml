name: SpaceFighter iOS - Signed IPA / TestFlight

# Signed iOS builds are manual to avoid accidental macOS minutes and uploads.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'iOS version in App Store Connect, for example 1.0.0'
        required: true
        type: string
        default: '1.0.0'
      upload_to_testflight:
        description: 'Upload signed IPA to TestFlight after successful build'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spacefighter-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Validate, sign and export iOS IPA
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: client

    env:
      APP_VERSION: ${{ inputs.app_version }}
      APP_BUNDLE_ID: com.theIT.spacefighter4
      APPLE_TEAM_ID: ZQ3P9M5HL6
      # Firebase web SDK settings are public client configuration, not Admin credentials.
      # SF_FIREBASE_API_KEY must be taken from the current Firebase *web* app.
      VITE_FIREBASE_API_KEY: ${{ vars.SF_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: distributed-inn-482605-c6.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: distributed-inn-482605-c6
      VITE_FIREBASE_STORAGE_BUCKET: distributed-inn-482605-c6.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '528039759292'
      VITE_FIREBASE_APP_ID: '1:528039759292:web:4aab5ad9ac2bddd9362fb9'
      VITE_FIREBASE_MEASUREMENT_ID: G-Y5CS812JKF
      # Staging only. GAME_API_ENABLED must remain false until backend QA is complete.
      VITE_GAME_API_URL: https://spacefighter-api-staging-528039759292.asia-southeast1.run.app/api/v1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26 on macOS runner
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app/Contents/Developer ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          if [[ "${XCODE_VERSION%%.*}" != '26' ]]; then
            echo 'Expected Xcode 26 on macos-26 runner.' >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Validate build configuration and repository baseline
        run: |
          set -euo pipefail
          [[ -f package-lock.json ]] || { echo 'client/package-lock.json must be committed for npm ci.' >&2; exit 1; }
          [[ -f ios/App/App.xcodeproj/project.pbxproj ]] || { echo 'Missing existing iOS Xcode project.' >&2; exit 1; }
          [[ -f ios/App/App/App.entitlements ]] || { echo 'Missing committed Apple Sign-In entitlement.' >&2; exit 1; }
          [[ -f ios/App/App/GoogleService-Info.plist ]] || { echo 'Missing iOS Firebase plist.' >&2; exit 1; }
          [[ -n "${VITE_FIREBASE_API_KEY:-}" ]] || { echo 'Set GitHub Actions variable SF_FIREBASE_API_KEY.' >&2; exit 1; }
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid app_version; use digits.digits[.digits].' >&2; exit 1; }
          [[ "$VITE_FIREBASE_PROJECT_ID" == 'distributed-inn-482605-c6' ]] || exit 1
          [[ "$VITE_GAME_API_URL" == 'https://spacefighter-api-staging-528039759292.asia-southeast1.run.app/api/v1' ]] || exit 1
          python3 - <<'PY'
          import os, pathlib, plistlib, re
          root = pathlib.Path.cwd()
          capacitor = (root / 'capacitor.config.ts').read_text(encoding='utf-8')
          project = (root / 'ios/App/App.xcodeproj/project.pbxproj').read_text(encoding='utf-8')
          firebase = plistlib.loads((root / 'ios/App/App/GoogleService-Info.plist').read_bytes())
          entitlement = plistlib.loads((root / 'ios/App/App/App.entitlements').read_bytes())
          bundle_id = os.environ['APP_BUNDLE_ID']
          assert re.search(r"appId:\s*'" + re.escape(bundle_id) + r"'", capacitor), 'Wrong Capacitor appId'
          assert len(re.findall(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*' + re.escape(bundle_id) + r'\s*;', project)) == 2, 'Wrong iOS bundle IDs'
          assert project.count('CODE_SIGN_ENTITLEMENTS = App/App.entitlements;') == 2, 'Missing entitlements in Debug or Release'
          assert firebase.get('PROJECT_ID') == os.environ['VITE_FIREBASE_PROJECT_ID'], 'Wrong Firebase plist project'
          assert firebase.get('BUNDLE_ID') == bundle_id, 'Wrong Firebase plist bundle'
          assert entitlement.get('com.apple.developer.applesignin') == ['Default'], 'Wrong Apple Sign-In entitlement'
          print('iOS App ID, Firebase plist and Apple Sign-In entitlement: PASS')
          PY
          printf 'BUILD_NUMBER=%s\n' "$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Client regression, gameplay and security gates
        run: |
          set -euo pipefail
          npm test
          npm run check:gameplay
          npm run check:safety

      - name: Build web assets with SpaceFighter Firebase configuration
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html

      - name: Synchronize existing Capacitor iOS SPM project
        run: |
          set -euo pipefail
          npx cap sync ios
          test -f ios/App/CapApp-SPM/Package.swift || { echo 'Expected existing Capacitor SPM integration.' >&2; exit 1; }
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Import Apple distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for key in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            [[ -n "${!key:-}" ]] || { echo "Missing GitHub Secret: $key" >&2; exit 1; }
          done

          CERT_PATH="$RUNNER_TEMP/spacefighter_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/spacefighter_appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/spacefighter_appstore.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/spacefighter-signing.keychain-db"
          export CERT_PATH PROFILE_PATH PROFILE_PLIST
          python3 - <<'PY'
          import base64, os, pathlib
          for name, destination in [
              ('BUILD_CERTIFICATE_BASE64', 'CERT_PATH'),
              ('BUILD_PROVISION_PROFILE_BASE64', 'PROFILE_PATH'),
          ]:
              data = base64.b64decode(os.environ[name], validate=True)
              if len(data) < 128:
                  raise SystemExit(f'{name} does not contain valid file content')
              pathlib.Path(os.environ[destination]).write_bytes(data)
          PY
          chmod 600 "$CERT_PATH" "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" -o "$PROFILE_PLIST" >/dev/null
          python3 - <<'PY'
          import datetime, os, plistlib, pathlib
          profile = plistlib.loads(pathlib.Path(os.environ['PROFILE_PLIST']).read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['APP_BUNDLE_ID']
          entitlements = profile.get('Entitlements', {})
          assert team in profile.get('TeamIdentifier', []), 'Profile belongs to another Apple Team'
          assert entitlements.get('application-identifier') == team + '.' + bundle, 'Profile Bundle ID mismatch'
          assert entitlements.get('com.apple.developer.applesignin') == ['Default'], 'Recreate profile after enabling Apple Sign-In'
          assert entitlements.get('get-task-allow') is False, 'Expected distribution profile, not development'
          assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices'), 'Expected App Store Connect distribution profile'
          assert profile['ExpirationDate'] > datetime.datetime.utcnow(), 'Provisioning profile expired'
          name = profile.get('Name', '')
          uuid = profile.get('UUID', '')
          assert name and uuid and '\n' not in name and '\r' not in name, 'Invalid provisioning profile metadata'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('APPLE_PROFILE_NAME=' + name + '\n')
              out.write('APPLE_PROFILE_UUID=' + uuid + '\n')
          print('Provisioning profile: Team, Bundle ID, Sign in with Apple, type and expiry PASS')
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -A
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v "$KEYCHAIN_PATH" | grep -F 'Apple Distribution:' || {
            echo 'No usable Apple Distribution identity was found in the p12.' >&2; exit 1;
          }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # UUID is read from the verified Apple provisioning profile, not hardcoded.
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$CERT_PATH"

      - name: Resolve SPM dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Archive signed iPhone and iPad app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SpaceFighter.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/SpaceFighterDerivedData" \
            CODE_SIGN_STYLE=Manual \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            "PROVISIONING_PROFILE_SPECIFIER=$APPLE_PROFILE_NAME" \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            "MARKETING_VERSION=$APP_VERSION" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            archive

      - name: Verify signed archive and Apple Sign-In entitlement
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SpaceFighter.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign --display --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/SpaceFighterSignedEntitlements.plist" 2>/dev/null
          export APP_PATH
          python3 - <<'PY'
          import os, pathlib, plistlib
          app = pathlib.Path(os.environ['APP_PATH'])
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          signed = plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'SpaceFighterSignedEntitlements.plist').read_bytes())
          assert info['CFBundleIdentifier'] == os.environ['APP_BUNDLE_ID'], 'Archive Bundle ID mismatch'
          assert signed.get('com.apple.developer.applesignin') == ['Default'], 'Apple Sign-In missing from actual code signature'
          assert signed.get('application-identifier') == os.environ['APPLE_TEAM_ID'] + '.' + os.environ['APP_BUNDLE_ID'], 'Signed application identifier mismatch'
          print('Signed archive App ID and Sign in with Apple: PASS')
          PY

      - name: Generate App Store Connect export options
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib
          data = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {os.environ['APP_BUNDLE_ID']: os.environ['APPLE_PROFILE_NAME']},
          }
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'SpaceFighterExportOptions.plist'
          path.write_bytes(plistlib.dumps(data))
          print('ExportOptions.plist generated for', os.environ['APP_BUNDLE_ID'])
          PY

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SpaceFighter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/SpaceFighterExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/SpaceFighterIPA"
          shopt -s nullglob
          ipa_files=("$RUNNER_TEMP/SpaceFighterIPA/"*.ipa)
          [[ ${#ipa_files[@]} -eq 1 ]] || { echo 'Expected exactly one exported IPA.' >&2; exit 1; }
          printf 'IOS_IPA_PATH=%s\n' "${ipa_files[0]}" >> "$GITHUB_ENV"
          echo 'Signed iOS IPA exported successfully.'

      - name: Upload signed IPA as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFighter-iOS-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SpaceFighterIPA/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Validate TestFlight API credentials when requested
        if: ${{ inputs.upload_to_testflight == true }}
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for key in APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY; do
            [[ -n "${!key:-}" ]] || { echo "Missing GitHub App Store Connect setting: $key" >&2; exit 1; }
          done

      - name: Upload to TestFlight (explicit opt-in only)
        if: ${{ inputs.upload_to_testflight == true }}
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IOS_IPA_PATH }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'

      - name: Clean temporary signing materials
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/spacefighter-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/spacefighter_distribution.p12" \
                "$RUNNER_TEMP/spacefighter_appstore.mobileprovision" \
                "$RUNNER_TEMP/spacefighter_appstore.plist"
