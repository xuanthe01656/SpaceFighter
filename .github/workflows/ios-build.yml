name: Build iOS App

on:
  push:
    branches: [ main ] 
  workflow_dispatch: 

jobs:
  build_ios:
    runs-on: macos-latest 

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: 1. Lấy mã nguồn
        uses: actions/checkout@v4
      - name: 1.5. Nâng cấp Xcode (Xóa cảnh báo iOS SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Hạ xuống bản 20 để ổn định nhất với Capacitor 7

      - name: 3. Cài đặt thư viện và Build Game (Frontend)
        run: |
          npm install
          echo "VITE_SOCKET_URL=https://astro-cat.onrender.com" > .env
          echo "VITE_FIREBASE_API_KEY=AIzaSyBs6iVyirKOErvyiNGFRq-lbKfWB_Q1yvQ" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=astro-cat-5.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=astro-cat-5" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=astro-cat-5.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=271365354200" >> .env
          echo "VITE_FIREBASE_APP_ID=1:271365354200:web:af4e26e6386c39af971dad" >> .env
          npm run build

      - name: 4. Khởi tạo và Đồng bộ code vào iOS
        working-directory: ./client
        run: |
          # BƠM THÊM 2 DÒNG NÀY ĐỂ ÉP PLUGIN NÂNG CẤP LÊN CHUẨN SPM MỚI NHẤT
          npm install @codetrix-studio/capacitor-google-auth@latest
          npm install @capacitor-community/apple-sign-in@latest
          
          # Các dòng dưới giữ nguyên
          npm install @capacitor/ios@7 
          npx cap sync ios
          npm install -g @capacitor/assets
          npx @capacitor/assets generate --ios
      - name: 4.5. Tự động tăng số Build (Fix lỗi trùng Version)
        run: |
          # Dùng số lần chạy của GitHub Actions làm số thứ tự Build (Ví dụ chạy lần 15 sẽ ra Build 15)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/App/App/Info.plist
      - name: 5. Mở két sắt lấy Chứng chỉ & Giấy phép Apple
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      
      - name: 5.5. Bơm quyền Apple Sign-In vào App (Fix Error 1000)
        run: |
          cd ios/App/App
          # Tự động tạo file Entitlements chứa quyền Apple Sign In
          cat <<EOF > App.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
          cd ..
          # Dùng Perl chèn quyền này vào lõi cấu hình Xcode
          perl -pi -e 's/(INFOPLIST_FILE = App\/Info.plist;)/$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' App.xcodeproj/project.pbxproj
      - name: 6. Build dự án ra file nén Archive (.xcarchive)
        run: |
          cd ios/App
          
          # Build thẳng bằng SPM, không dùng CocoaPods nữa
          xcodebuild -project App.xcodeproj \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          clean archive \
          -archivePath $RUNNER_TEMP/AstroCat.xcarchive \
          CODE_SIGN_STYLE=Manual \
          PROVISIONING_PROFILE_SPECIFIER="AstroCat_AppStore_Profile" \
          DEVELOPMENT_TEAM="ZQ3P9M5HL6" \
          CODE_SIGN_IDENTITY="Apple Distribution"

      - name: 7. Tạo cấu hình xuất file IPA
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ban.astrocat</key>
                  <string>AstroCat_AppStore_Profile</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: 8. Đóng gói ra file ứng dụng (.ipa)
        run: |
          cd ios/App
          xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/AstroCat.xcarchive \
          -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
          -exportPath $RUNNER_TEMP/export \
          DEVELOPMENT_TEAM="ZQ3P9M5HL6" \
          CODE_SIGN_IDENTITY="Apple Distribution"

      - name: 9. Tải file IPA lên kho thành quả
        uses: actions/upload-artifact@v4
        with:
          name: AstroCat-iOS-Release
          path: ${{ runner.temp }}/export/*.ipa
      - name: 10. Tự động đẩy App lên App Store Connect (TestFlight)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Tìm file .ipa vừa tạo
          IPA_PATH=$(find ${{ runner.temp }}/export -name "*.ipa" | head -n 1)
          echo "Đang tải lên file: $IPA_PATH"
          
          # Dùng công cụ altool của Apple để upload
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"