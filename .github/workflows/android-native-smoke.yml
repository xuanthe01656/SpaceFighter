name: SpaceFighter Android - Capacitor 8 Native Smoke

# Build-only validation after an approved main push. Stable signed DEBUG APK only. No release/distribution.
on:
  workflow_dispatch:
    inputs:
      touch_qa:
        description: 'Build offline Guest Alpha1 touch QA debug APK (manual only)'
        required: false
        type: boolean
        default: false
      guest_combat_v2_qa:
        description: 'Build local-only Guest Combat V2 skills/armor QA debug APK'
        required: false
        type: boolean
        default: false
      guest_dungeon_v39_qa:
        description: 'Build local-only Dungeon V3.9.8 production hardening QA APK (3 full dungeons, selectable loadouts, no rewards)'
        required: false
        type: boolean
        default: false
      cloud_qa_ui:
        description: 'Build NON-ECONOMIC server-authoritative Cloud Alpha1 QA cockpit (manual only)'
        required: false
        type: boolean
        default: false
      c12_candidate_qa:
        description: 'C12 candidate-only battle E2E over sealed server journal (manual, NO REWARDS)'
        required: false
        type: boolean
        default: false
      c9_babylon_qa:
        description: 'Add C9 Babylon server-checkpoint display to manual Cloud QA APK only'
        required: false
        type: boolean
        default: false
      c15_rc1b:
        description: 'Build frozen C15-RC1B diagnostic APK'
        required: false
        type: boolean
        default: false
      c15_rc1c:
        description: 'Build frozen C15-RC1C/RC2 diagnostic APK'
        required: false
        type: boolean
        default: false
      c15_rc3:
        description: 'Build frozen C15-RC3 staging QA APK'
        required: false
        type: boolean
        default: false
      c15_rc4:
        description: 'Build C15-RC4 release-candidate UI with canary settlement and no QA controls'
        required: false
        type: boolean
        default: false
      c15_rc5:
        description: 'Build C15-RC5 Android production input and frame-pacing candidate'
        required: false
        type: boolean
        default: false
      c15_rc7_assets:
        description: 'Build C15-RC7 Android app-private remote asset delivery candidate'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spacefighter-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-debug:
    name: Android API 36 / Java 21 / Gradle 8.14.3
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 75

    defaults:
      run:
        shell: bash
        working-directory: client

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.SF_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: distributed-inn-482605-c6.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: distributed-inn-482605-c6
      VITE_FIREBASE_STORAGE_BUCKET: distributed-inn-482605-c6.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '528039759292'
      VITE_FIREBASE_APP_ID: '1:528039759292:web:4aab5ad9ac2bddd9362fb9'
      VITE_FIREBASE_MEASUREMENT_ID: G-Y5CS812JKF
      VITE_GAME_API_URL: https://spacefighter-api-staging-528039759292.asia-southeast1.run.app/api/v1
      VITE_GAME_API_ENABLED: 'false'
      VITE_SF_NATIVE_TOUCH_QA: ${{ github.event_name == 'workflow_dispatch' && inputs.touch_qa == true && '1' || '0' }}
      VITE_SF_GUEST_ABILITIES_QA: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_combat_v2_qa == true && 'true' || 'false' }}
      VITE_SF_GUEST_COMBAT_V2_QA: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_combat_v2_qa == true && 'true' || 'false' }}
      VITE_SF_DUNGEON_QA: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_dungeon_v39_qa == true && 'true' || 'false' }}
      VITE_SF_DUNGEON_QA_REWARDS: 'false'
      VITE_SF_DUNGEON_PARITY_V38: 'true'
      VITE_C8_CLOUD_QA_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_qa_ui == true && 'true' || 'false' }}
      VITE_C9_BABYLON_QA_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_qa_ui == true && inputs.c9_babylon_qa == true && 'true' || 'false' }}
      VITE_C12_CANDIDATE_QA_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_qa_ui == true && inputs.c9_babylon_qa == true && inputs.c12_candidate_qa == true && 'true' || 'false' }}
      VITE_C15_RC1B_ENABLED: ${{ inputs.c15_rc1b == true || inputs.c15_rc1c == true || inputs.c15_rc3 == true || inputs.c15_rc4 == true || inputs.c15_rc5 == true || inputs.c15_rc7_assets == true }}
      VITE_C15_CONTROL_AB_QA: ${{ github.event_name == 'workflow_dispatch' && inputs.c15_rc1c == true && 'true' || 'false' }}
      VITE_C15_RC3_ENABLED: ${{ inputs.c15_rc3 == true && 'true' || 'false' }}
      VITE_C15_RC4_CANARY_SETTLEMENT_ENABLED: ${{ (inputs.c15_rc4 == true || inputs.c15_rc5 == true || inputs.c15_rc7_assets == true) && 'true' || 'false' }}
      VITE_C15_RC5_CONTROL_ENABLED: ${{ (inputs.c15_rc5 == true || inputs.c15_rc7_assets == true) && 'true' || 'false' }}
      VITE_C15_RC7_ASSET_DELIVERY_ENABLED: ${{ inputs.c15_rc7_assets == true && 'true' || 'false' }}
      VITE_SF_BUILD_CHANNEL: ${{ (inputs.c15_rc4 == true || inputs.c15_rc5 == true || inputs.c15_rc7_assets == true) && 'release-candidate' || 'staging-qa' }}
      VITE_APP_VERSION: ${{ inputs.c15_rc7_assets == true && '1.2.3' || (inputs.c15_rc5 == true && '1.2.2' || '1.2.1') }}
      VITE_C15_CONTROL_PROFILE_ID: ${{ (inputs.c15_rc5 == true || inputs.c15_rc7_assets == true) && 'arcade-responsive-v2' || 'arcade-responsive-v1' }}

    steps:
      - name: Check out only current revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject accidental Claude worktree gitlinks
        run: |
          set -euo pipefail
          if git -C .. ls-files --stage | grep -E '^160000 [[:xdigit:]]{40} 0[[:space:]]+\.claude/worktrees/'; then
            echo "::error::Generated Claude worktrees must not be Git submodules." >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore existing Android keystore secrets and verify registered SHA fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing required GitHub Actions secret: $key" >&2; exit 1; }
          done
          python3 - <<'PY'
          import base64, os, pathlib, re, subprocess, sys
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'spacefighter-stable-qa-signing.jks'
          try:
              content = base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True)
          except (ValueError, base64.binascii.Error):
              sys.exit('QA keystore secret is not valid Base64')
          if not (128 <= len(content) <= 1024 * 1024):
              sys.exit('QA keystore size is invalid')
          path.write_bytes(content)
          path.chmod(0o600)
          command = [
              'keytool', '-list', '-v', '-keystore', str(path),
              '-alias', os.environ['ANDROID_KEY_ALIAS'],
              '-storepass:env', 'ANDROID_KEYSTORE_PASSWORD',
          ]
          result = subprocess.run(command, capture_output=True, text=True)
          if result.returncode != 0 or 'PrivateKeyEntry' not in result.stdout:
              sys.exit('Keystore/alias/password invalid, or alias has no private key')
          expected = {
              'SHA1': 'D667B762E0A5EA09BB43B0730EF7CFDA1707F55A',
              'SHA256': '60B1E4349BA776EBD0138E7713AE2E78E292EB048A52FBBE187699F2CE09D8C4',
          }
          for algorithm, want in expected.items():
              match = re.search(r'^\s*' + algorithm + r':\s*([0-9a-fA-F:]+)\s*$', result.stdout, re.M)
              if not match:
                  sys.exit('Cannot inspect ' + algorithm + ' signing fingerprint')
              actual = match.group(1).replace(':', '').upper()
              if actual != want:
                  sys.exit('QA signing certificate ' + algorithm + ' does not match Firebase registration')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('SF_ANDROID_QA_KEYSTORE_PATH=' + str(path) + '\n')
          print('Stable QA certificate SHA-1 and SHA-256 verified; private signing material not logged')
          PY

      - name: Set up Node 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate native project and staging configuration
        run: |
          set -euo pipefail
          [[ -f package-lock.json && -f capacitor.config.ts ]] || exit 1
          [[ -f android/app/build.gradle && -f android/variables.gradle ]] || exit 1
          [[ -n "${VITE_FIREBASE_API_KEY:-}" ]] || { echo 'SF_FIREBASE_API_KEY must be configured in repository variables.' >&2; exit 1; }
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'com.theIT.spacefighter4' android/app/build.gradle
          test -f android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          ! grep -q 'com.codetrixstudio.capacitor.GoogleAuth' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          grep -q 'ModifiedMainActivityForSocialLoginPlugin' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          grep -q 'handleGoogleLoginIntent' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          grep -q 'selectGameRefreshRate' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          grep -q 'android:appCategory="game"' android/app/src/main/AndroidManifest.xml
          grep -q 'preferredRefreshRate = targetRefreshRate' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          grep -q 'attributes.setFrameRateBoostOnTouchEnabled(true)' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java
          test -f android/app/src/main/java/com/theIT/spacefighter4/SpaceFighterAssetStorePlugin.java
          grep -q 'registerPlugin(SpaceFighterAssetStorePlugin.class)' android/app/src/main/java/com/theIT/spacefighter4/MainActivity.java

      - name: Install exact locked dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Run current Android candidate fast source gate once
        run: |
          set -euo pipefail
          if [[ "${{ inputs.c15_rc7_assets }}" == 'true' || "${{ inputs.guest_combat_v2_qa }}" == 'true' || "${{ inputs.guest_dungeon_v39_qa }}" == 'true' ]]; then
            npm run gate:c15-rc7:fast
          else
            npm run gate:c15-rc5:fast
          fi
          npm audit --omit=dev --audit-level=high

      - name: Build real mobile WebView payload
        run: |
          set -euo pipefail
          if [[ "$VITE_SF_GUEST_COMBAT_V2_QA" == 'true' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo 'Guest Combat V2 QA is manual-only' >&2; exit 1; }
            [[ "$VITE_SF_GUEST_ABILITIES_QA" == 'true' ]] || exit 1
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || { echo 'Guest Combat V2 QA must not enable Game API' >&2; exit 1; }
            [[ "$VITE_SF_BUILD_CHANNEL" == 'staging-qa' ]] || { echo 'Guest Combat V2 QA may not use a release channel' >&2; exit 1; }
            [[ "$VITE_C8_CLOUD_QA_UI" == 'false' && "$VITE_C15_RC1B_ENABLED" == 'false' ]] || { echo 'Guest Combat V2 QA must be isolated from Cloud/C15 modes' >&2; exit 1; }
            echo 'Building local-only Guest Combat V2 skills/armor QA payload; NO CLOUD, NO REWARDS, NOT FOR RELEASE'
          fi
          if [[ "$VITE_SF_DUNGEON_QA" == 'true' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo 'Dungeon QA is manual-only' >&2; exit 1; }
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || { echo 'Dungeon QA must not enable Game API' >&2; exit 1; }
            [[ "$VITE_SF_BUILD_CHANNEL" == 'staging-qa' ]] || { echo 'Dungeon QA may not use a release channel' >&2; exit 1; }
            [[ "$VITE_SF_DUNGEON_QA_REWARDS" == 'false' && "$VITE_SF_DUNGEON_PARITY_V38" == 'true' ]] || exit 1
            [[ "${{ inputs.touch_qa }}" != 'true' && "${{ inputs.guest_combat_v2_qa }}" != 'true' && "${{ inputs.cloud_qa_ui }}" != 'true' ]] || { echo 'Dungeon QA must be built separately from other QA modes' >&2; exit 1; }
            [[ "${{ inputs.c15_rc1b }}" != 'true' && "${{ inputs.c15_rc1c }}" != 'true' && "${{ inputs.c15_rc3 }}" != 'true' && "${{ inputs.c15_rc4 }}" != 'true' && "${{ inputs.c15_rc5 }}" != 'true' && "${{ inputs.c15_rc7_assets }}" != 'true' ]] || { echo 'Dungeon QA cannot be combined with C15 release candidates' >&2; exit 1; }
            echo 'Building local-only Dungeon V3.9.8 production hardening QA harness; 3 FULL DUNGEONS, SELECTABLE LOADOUTS, NO ENERGY, NO REWARDS, NO TRUSTED WRITES'
          fi
          if [[ "$VITE_SF_NATIVE_TOUCH_QA" == '1' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo 'Touch QA is manual-only' >&2; exit 1; }
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || { echo 'Touch QA must not enable Cloud Game API' >&2; exit 1; }
            echo 'Building LOCAL-ONLY debug touch QA payload; NOT FOR RELEASE'
          fi
          if [[ "$VITE_C8_CLOUD_QA_UI" == 'true' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo 'Cloud QA is manual-only' >&2; exit 1; }
            [[ "$VITE_SF_NATIVE_TOUCH_QA" == '0' ]] || { echo 'Cloud QA and Guest Touch QA must not be combined' >&2; exit 1; }
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || { echo 'Cloud QA must not enable legacy battle API' >&2; exit 1; }
            echo 'Building isolated NON-ECONOMIC Cloud QA cockpit; staging QA server separately gated'
          fi
          if [[ "$VITE_C9_BABYLON_QA_UI" == 'true' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo 'C9 Babylon QA is manual-only' >&2; exit 1; }
            [[ "$VITE_C8_CLOUD_QA_UI" == 'true' ]] || { echo 'C9 Babylon QA requires Cloud QA cockpit' >&2; exit 1; }
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || { echo 'C9 QA may not enable legacy Cloud battles' >&2; exit 1; }
            echo 'C9 checkpoint-driven Babylon diagnostics; no production Battle/settlement'
          fi
          if [[ "$VITE_C12_CANDIDATE_QA_UI" == 'true' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || exit 1
            [[ "$VITE_C8_CLOUD_QA_UI" == 'true' && "$VITE_C9_BABYLON_QA_UI" == 'true' ]] || exit 1
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || exit 1
            echo 'C12 candidate test ONLY, requires separately approved server flag and UID allowlist; no rewards'
          fi
          if [[ "$VITE_C15_RC1B_ENABLED" == 'true' ]]; then
            [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo 'C15 local runtime is manual-only' >&2; exit 1; }
            [[ "$VITE_SF_NATIVE_TOUCH_QA" == '0' && "$VITE_C8_CLOUD_QA_UI" == 'false' && "$VITE_C9_BABYLON_QA_UI" == 'false' && "$VITE_C12_CANDIDATE_QA_UI" == 'false' ]] || { echo 'C15 local runtime must be built separately from legacy QA modes' >&2; exit 1; }
            [[ "$VITE_GAME_API_ENABLED" == 'false' ]] || exit 1
            if [[ "${{ inputs.c15_rc7_assets }}" == 'true' ]]; then
              [[ "${{ inputs.c15_rc1b }}" != 'true' && "${{ inputs.c15_rc1c }}" != 'true' && "${{ inputs.c15_rc3 }}" != 'true' && "${{ inputs.c15_rc4 }}" != 'true' && "${{ inputs.c15_rc5 }}" != 'true' ]] || { echo 'RC1B through RC7 Android candidate inputs are mutually exclusive' >&2; exit 1; }
              [[ "$VITE_SF_BUILD_CHANNEL" == 'release-candidate' && "$VITE_C15_RC4_CANARY_SETTLEMENT_ENABLED" == 'true' && "$VITE_C15_RC5_CONTROL_ENABLED" == 'true' && "$VITE_C15_RC7_ASSET_DELIVERY_ENABLED" == 'true' && "$VITE_C15_RC3_ENABLED" == 'false' && "$VITE_C15_CONTROL_AB_QA" == 'false' && "$VITE_C15_CONTROL_PROFILE_ID" == 'arcade-responsive-v2' && "$VITE_APP_VERSION" == '1.2.3' ]] || exit 1
              echo 'Building RC7 app-private remote asset delivery + RC5 production control candidate'
            elif [[ "${{ inputs.c15_rc5 }}" == 'true' ]]; then
              [[ "${{ inputs.c15_rc1b }}" != 'true' && "${{ inputs.c15_rc1c }}" != 'true' && "${{ inputs.c15_rc3 }}" != 'true' && "${{ inputs.c15_rc4 }}" != 'true' && "${{ inputs.c15_rc7_assets }}" != 'true' ]] || { echo 'RC1B through RC7 Android candidate inputs are mutually exclusive' >&2; exit 1; }
              [[ "$VITE_SF_BUILD_CHANNEL" == 'release-candidate' && "$VITE_C15_RC4_CANARY_SETTLEMENT_ENABLED" == 'true' && "$VITE_C15_RC5_CONTROL_ENABLED" == 'true' && "$VITE_C15_RC7_ASSET_DELIVERY_ENABLED" == 'false' && "$VITE_C15_RC3_ENABLED" == 'false' && "$VITE_C15_CONTROL_AB_QA" == 'false' && "$VITE_C15_CONTROL_PROFILE_ID" == 'arcade-responsive-v2' && "$VITE_APP_VERSION" == '1.2.2' ]] || exit 1
              echo 'Building frozen RC5 Android production input + variable-refresh frame pacing candidate'
            elif [[ "${{ inputs.c15_rc4 }}" == 'true' ]]; then
              [[ "${{ inputs.c15_rc1b }}" != 'true' && "${{ inputs.c15_rc1c }}" != 'true' && "${{ inputs.c15_rc3 }}" != 'true' && "${{ inputs.c15_rc5 }}" != 'true' ]] || { echo 'RC1B, RC1C, RC3, RC4 and RC5 inputs are mutually exclusive' >&2; exit 1; }
              [[ "$VITE_SF_BUILD_CHANNEL" == 'release-candidate' && "$VITE_C15_RC4_CANARY_SETTLEMENT_ENABLED" == 'true' && "$VITE_C15_RC5_CONTROL_ENABLED" == 'false' && "$VITE_C15_RC3_ENABLED" == 'false' && "$VITE_C15_CONTROL_AB_QA" == 'false' ]] || exit 1
              echo 'Building frozen RC4 release-candidate UI; QA controls removed, canary settlement only'
            elif [[ "${{ inputs.c15_rc3 }}" == 'true' ]]; then
              [[ "${{ inputs.c15_rc1b }}" != 'true' && "${{ inputs.c15_rc1c }}" != 'true' ]] || { echo 'RC1B, RC1C and RC3 inputs are mutually exclusive' >&2; exit 1; }
              [[ "$VITE_C15_RC3_ENABLED" == 'true' && "$VITE_C15_CONTROL_AB_QA" == 'false' && "$VITE_C15_CONTROL_PROFILE_ID" == 'arcade-responsive-v1' ]] || exit 1
              echo 'Building C15-RC3 staging settlement claim UI; allowlisted economy only, production rewards OFF'
            elif [[ "${{ inputs.c15_rc1c }}" == 'true' ]]; then
              [[ "${{ inputs.c15_rc1b }}" != 'true' && "${{ inputs.c15_rc3 }}" != 'true' ]] || { echo 'RC1B, RC1C and RC3 inputs are mutually exclusive' >&2; exit 1; }
              [[ "$VITE_C15_CONTROL_AB_QA" == 'true' && "$VITE_C15_RC3_ENABLED" == 'false' && "$VITE_C15_CONTROL_PROFILE_ID" == 'arcade-responsive-v1' ]] || exit 1
              echo 'Building C15-RC1C control A/B + RC2 trusted outcome; NON-ECONOMIC, NO SETTLEMENT'
            else
              [[ "${{ inputs.c15_rc3 }}" != 'true' ]] || exit 1
              echo 'Building C15-RC1B local deterministic runtime + resource delivery; NON-ECONOMIC, NO SETTLEMENT'
            fi
          fi
          npm run build:mobile
          test -s dist/index.html

      - name: Synchronize Android plugins and verify graph
        run: |
          set -euo pipefail
          npx --no-install cap sync android
          grep -q 'capgo-capacitor-social-login' android/capacitor.settings.gradle
          grep -q 'capgo-capacitor-social-login' android/app/capacitor.build.gradle
          if grep -Ei 'codetrix|capacitor-community-apple-sign-in' android/capacitor.settings.gradle android/app/capacitor.build.gradle; then
            echo 'Legacy login plugin found in native graph.' >&2
            exit 1
          fi

      - name: Install Android 36 SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Android DEBUG APK using existing stable key (never release)
        env:
          SF_ANDROID_QA_SIGNING_ENABLED: 'true'
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -s "$SF_ANDROID_QA_KEYSTORE_PATH" ]] || { echo 'QA signing keystore was not restored' >&2; exit 1; }
          cd android
          gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/debug/app-debug.aab

      - name: Verify actual APK uses the registered SHA-1 and SHA-256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          signer = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '36.0.0' / 'apksigner'
          apk = pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          if not signer.is_file() or not apk.is_file():
              sys.exit('Android apksigner or output APK is missing')
          result = subprocess.run([str(signer), 'verify', '--verbose', '--print-certs', str(apk)],
                                  capture_output=True, text=True)
          if result.returncode != 0:
              sys.exit('APK signature verification failed')
          expected = {
              'SHA-1': 'D667B762E0A5EA09BB43B0730EF7CFDA1707F55A',
              'SHA-256': '60B1E4349BA776EBD0138E7713AE2E78E292EB048A52FBBE187699F2CE09D8C4',
          }
          if re.search(r'^\s*Signer #2 certificate', result.stdout, re.M):
              sys.exit('Multiple APK certificate signers are not permitted for QA')
          for label, want in expected.items():
              match = re.search(r'^\s*Signer #1 certificate ' + label + r' digest:\s*([0-9a-fA-F:]+)\s*$',
                                result.stdout, re.M)
              if not match or match.group(1).replace(':', '').upper() != want:
                  sys.exit('Signed APK ' + label + ' mismatch; artifact upload blocked')
          print('SIGNED_APK_SHA_MATCH: exact registered QA signing certificate verified')
          PY

      - name: Select manual Android artifact name
        run: |
          set -euo pipefail
          name='spacefighter-android-debug-not-for-release'
          if [[ "${{ inputs.guest_dungeon_v39_qa }}" == 'true' ]]; then
            name='spacefighter-android-dungeon-v398-production-hardening-qa-debug-no-rewards'
          elif [[ "${{ inputs.guest_combat_v2_qa }}" == 'true' ]]; then
            name='spacefighter-android-guest-combat-v2-qa-debug-not-for-release'
          elif [[ "${{ inputs.c15_rc7_assets }}" == 'true' ]]; then
            name='spacefighter-android-c15-rc7-asset-delivery-candidate'
          elif [[ "${{ inputs.c15_rc5 }}" == 'true' ]]; then
            name='spacefighter-android-c15-rc5-internal-candidate'
          elif [[ "${{ inputs.c15_rc4 }}" == 'true' ]]; then
            name='spacefighter-android-c15-rc4-internal-candidate'
          elif [[ "${{ inputs.c15_rc3 }}" == 'true' ]]; then
            name='spacefighter-android-c15-rc3-debug-not-for-release'
          elif [[ "${{ inputs.c15_rc1c }}" == 'true' ]]; then
            name='spacefighter-android-c15-rc1c-debug-not-for-release'
          elif [[ "${{ inputs.c15_rc1b }}" == 'true' ]]; then
            name='spacefighter-android-c15-rc1b-debug-not-for-release'
          elif [[ "${{ inputs.cloud_qa_ui }}" == 'true' && "${{ inputs.c9_babylon_qa }}" == 'true' && "${{ inputs.c12_candidate_qa }}" == 'true' ]]; then
            name='spacefighter-android-c12-candidate-debug-not-for-release'
          elif [[ "${{ inputs.cloud_qa_ui }}" == 'true' && "${{ inputs.c9_babylon_qa }}" == 'true' ]]; then
            name='spacefighter-android-c9-babylon-qa-debug-not-for-release'
          elif [[ "${{ inputs.cloud_qa_ui }}" == 'true' ]]; then
            name='spacefighter-android-cloud-qa-c8-debug-not-for-release'
          elif [[ "${{ inputs.touch_qa }}" == 'true' ]]; then
            name='spacefighter-android-touch-qa-debug-not-for-release'
          fi
          echo "SF_ANDROID_ARTIFACT_NAME=$name" >> "$GITHUB_ENV"

      - name: Preserve debug APK for manual device QA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SF_ANDROID_ARTIFACT_NAME }}
          path: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
            client/android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary QA signing keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/spacefighter-stable-qa-signing.jks"
