name: SpaceFighter C15-RC5 Android Input and Frame-Pacing Gate
on:
  workflow_dispatch:
concurrency:
  group: c15-rc5-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install exact client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Install exact server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Run frozen RC5 manual audit gate
        working-directory: client
        run: npm run gate:c15-rc5
      - name: Upload frozen RC5 Android control evidence
        uses: actions/upload-artifact@v4
        with:
          name: spacefighter-c15-rc5-gate-report
          path: client/dist/c15-rc5/
          if-no-files-found: error
          retention-days: 30
