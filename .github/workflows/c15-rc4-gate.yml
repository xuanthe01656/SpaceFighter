name: SpaceFighter C15-RC4 Production Hardening Gate
on:
  workflow_dispatch:
concurrency:
  group: c15-rc4-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install exact client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Install exact server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Run frozen RC4 manual audit gate
        working-directory: client
        run: npm run gate:c15-rc4
      - name: Upload RC4 release evidence
        uses: actions/upload-artifact@v4
        with:
          name: spacefighter-c15-rc4-gate-report
          path: client/dist/c15-rc4/
          if-no-files-found: error
          retention-days: 30
